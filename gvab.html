<style>
/* 版面：手機單欄 App（上方月份列、下方分頁列），桌機放寬成雙欄；幾何粗框線＋亮色硬陰影 */
:root{

  --gold:#F5B700; --ochre:#B97A12; --red:#FF4B1F; --neon:#C6FF1A; --pink:#FF2E93;

  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#161003; --surface:#231906; --ink:#FFF3CF; --muted:#C2A968; --line:#4A3810;
  --gold:#FFC61A; --ochre:#DB9A2E; --red:#FF5A2E; --neon:#C6FF1A; --pink:#FF4FA3;
  --exp:#FF7A52; --inc:#C6FF1A; --on:#241803; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#161003; --surface:#231906; --ink:#FFF3CF; --muted:#C2A968; --line:#4A3810;
  --gold:#FFC61A; --ochre:#DB9A2E; --red:#FF5A2E; --neon:#C6FF1A; --pink:#FF4FA3;
  --exp:#FF7A52; --inc:#C6FF1A; --on:#241803; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:2px solid var(--ink);
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;letter-spacing:.04em;min-width:0}
.brand svg{width:28px;height:28px;flex:none}

main{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:18px 110px;display:flex;flex-direction:column;gap:22px}

.hero{display:grid;grid-template-columns:1fr;gap:8px;justify-items:center;text-align:center}

@media (prefers-reduced-motion:reduce){.flower .spin{animation:none}}
.hero-t{display:flex;flex-direction:column;gap:4px;align-items:center;min-width:0}

  .hero-t{align-items:flex-start}.pair{justify-content:flex-start}}

.accs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.acc{background:var(--surface);border:2px solid var(--ink);box-shadow:5px 5px 0 var(--gold);padding:12px 14px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.acc:nth-child(3n+2){box-shadow:5px 5px 0 var(--red)} .acc:nth-child(3n){box-shadow:5px 5px 0 var(--neon)}
.acc-h{display:flex;align-items:center;gap:8px}
.code{width:30px;height:30px;border-radius:50%;background:var(--neon);color:var(--on);border:2px solid var(--ink);display:grid;place-items:center;font:800 11px var(--display);flex:none}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--ink);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--gold);color:var(--on);font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink)}

.list{display:flex;flex-direction:column}
.day{font-size:12px;letter-spacing:.08em;color:var(--muted);padding:12px 0 4px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.rec{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink)}
.rec .mid{min-width:0;display:flex;flex-direction:column}
.rec .mid b{font-weight:500;overflow-wrap:anywhere}
.rec .mid small{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.rec .amt{font:600 16px var(--display);white-space:nowrap}
.empty{border:2px dashed var(--line);padding:22px 16px;text-align:center;color:var(--muted)}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-size:12px;letter-spacing:.08em;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{
  width:100%;min-width:0;background:var(--surface);border:2px solid var(--ink);border-radius:0;padding:9px 10px}
textarea{min-height:64px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:2px solid var(--ink);background:var(--surface);padding:10px 14px;font-weight:700}
.btn.pri{background:var(--gold);color:var(--on);box-shadow:4px 4px 0 var(--ink)}
.btn.hot{background:var(--red);color:var(--on)}
.btn.neon{background:var(--neon);color:var(--on)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.row-b{display:flex;gap:10px;flex-wrap:wrap}
.row-b>*{flex:1 1 130px}
.note{font-size:13px;color:var(--muted)}
.scanmsg{border:2px solid var(--ink);background:var(--neon);color:var(--on);padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.it{display:grid;grid-template-columns:1fr 58px 84px 34px;gap:6px}
.it input{padding:7px 8px}
.it button{border:2px solid var(--ink);background:var(--surface)}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:2px solid var(--ink);
  display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{border:0;background:none;padding:8px 2px;font-size:13px;font-weight:500;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--ink);font-weight:700;box-shadow:inset 0 -4px 0 var(--gold)}
.tabs .fab{justify-self:center;width:54px;height:54px;border-radius:50%;border:2px solid var(--ink);background:var(--red);color:var(--on);font:800 28px/1 var(--display);margin-top:-22px;box-shadow:3px 3px 0 var(--ink)}

.sheet{position:fixed;inset:0;z-index:10;background:rgba(20,12,0,.55);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);border:2px solid var(--ink);border-bottom:0;width:100%;max-width:560px;max-height:94%;overflow:auto;
  padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.sheet{align-items:center}.panel{border-bottom:2px solid var(--ink);box-shadow:8px 8px 0 var(--gold);max-height:90%}}
.sh-head{display:flex;justify-content:space-between;align-items:center}
.sh-head h2{font-size:17px}
.x{border:2px solid var(--ink);background:var(--surface);width:34px;height:34px;border-radius:50%}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);padding:9px 14px;max-width:min(92vw,460px);font-size:14px;text-align:center}

.charts{display:grid;grid-template-columns:1fr;gap:22px}
@media (min-width:820px){.charts{grid-template-columns:1.2fr 1fr}}
.bar{display:grid;grid-template-columns:5.5em 1fr auto;gap:8px;align-items:center;font-size:13px;padding:5px 0}
.bar .name{overflow-wrap:anywhere}
.track{height:18px;background:var(--surface);border:2px solid var(--ink)}
.fill{height:100%;min-width:2px;border-right:2px solid var(--ink)}
.bar .v{font-family:var(--display);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.pie{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.pie svg{width:190px;max-width:100%;flex:none}
.pie svg text{fill:var(--ink);font-family:var(--display)}
.legend{display:flex;flex-direction:column;gap:5px;font-size:13px;flex:1 1 160px;min-width:0}
.legend div{display:flex;gap:8px;align-items:center}
.legend span:nth-child(2){flex:1;min-width:0;overflow-wrap:anywhere}
.ci{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ci input{width:20px;height:20px}
.sync{font-size:13px;display:flex;gap:8px;align-items:center}
.sync i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);background:var(--gold);flex:none}
.sync.ok i{background:var(--neon)} .sync.err i{background:var(--red)}
pre.out{max-height:40vh;overflow:auto;background:var(--surface);border:2px solid var(--ink);padding:8px;font-size:12px;white-space:pre-wrap;word-break:break-all;margin:0}
</style>

<header class="top">
  <div class="brand"><span id="logo"></span><span>地球村帳本</span></div>
  <div class="month"><button data-act="pm" aria-label="上個月">‹</button><span id="mLabel"></span><button data-act="nm" aria-label="下個月">›</button></div>
</header>
<main id="view"></main>

  <button data-act="tab" data-tab="home">首頁</button>
  <button data-act="tab" data-tab="list">明細</button>
  <button class="fab" data-act="add" aria-label="新增紀錄">+</button>

<input type="file" id="fImg" accept="image/*" hidden>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const CUR={TWD:['NT$',0],JPY:['¥',0],MYR:['RM',2],USD:['US$',2],SGD:['S$',2],HKD:['HK$',2],CNY:['CN¥',2],KRW:['₩',0],THB:['฿',2],VND:['₫',0],IDR:['Rp',0],PHP:['₱',2],EUR:['€',2],GBP:['£',2],AUD:['A$',2]};
const COUNTRIES=[['TW','台灣','TWD'],['JP','日本','JPY'],['MY','馬來西亞','MYR'],['US','美國','USD'],['SG','新加坡','SGD'],['HK','香港','HKD'],['CN','中國','CNY'],['KR','韓國','KRW'],['TH','泰國','THB'],['VN','越南','VND'],['ID','印尼','IDR'],['PH','菲律賓','PHP'],['EU','歐元區','EUR'],['GB','英國','GBP'],['AU','澳洲','AUD'],['XX','其他','USD']];
// 概略匯率（對新台幣），僅作預設值，可在帳戶設定中修改
const ROUGH={TWD:1,JPY:.21,MYR:7.3,USD:32,SGD:24.5,HKD:4.1,CNY:4.5,KRW:.023,THB:.95,VND:.0013,IDR:.002,PHP:.55,EUR:35,GBP:41,AUD:21};
const COLORS=['#F5B700','#FF4B1F','#9BD600','#B97A12','#FF2E93','#00C2B8','#FF8A00','#7A4DFF','#E0C36A','#8C5A2B'];
const roughRate=(cur,base)=>+((ROUGH[cur]||1)/(ROUGH[base]||1)).toPrecision(4);

function defaults(){return{meta:{v:1,base:'TWD',accounts:[
  {id:'tw',name:'台灣',country:'TW',cur:'TWD',rate:1},
  {id:'jp',name:'日本',country:'JP',cur:'JPY',rate:.21},
  {id:'my',name:'馬來西亞',country:'MY',cur:'MYR',rate:7.3}],
  cats:{exp:['餐飲','交通','購物','日用','居住','娛樂','醫療','教育','旅行','其他'],inc:['薪資','獎金','投資','轉入','其他收入']}},months:{}}}
let S=defaults();
try{const s=JSON.parse(localStorage.getItem('gv-ledger')||'null');if(s&&s.meta&&s.months)S=s}catch(e){}
const now=new Date();
let M=`${now.getFullYear()}-${pad(now.getMonth()+1)}`, TAB='home', ACC='all', STYPE='exp', Q='', F=null, CI=null, SYNC='wait';
const today=()=>{const d=new Date();return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const nowT=()=>{const d=new Date();return`${pad(d.getHours())}:${pad(d.getMinutes())}`};

/* ---------- 儲存與同步 ---------- */
let metaRef=null,monthsCol=null;const dirty=new Set(),writing={};
function saveLocal(){try{localStorage.setItem('gv-ledger',JSON.stringify(S))}catch(e){}}
function touch(key){saveLocal();if(!metaRef)return;dirty.add(key);flush(key)}
async function flush(key){
  if(writing[key])return;writing[key]=true;
  try{while(dirty.has(key)){dirty.delete(key);
    if(key==='meta')await metaRef.set(clone(S.meta));
    else{const d=S.months[key];if(d&&Object.keys(d.recs).length)await monthsCol.doc(key).set(clone(d));else await monthsCol.doc(key).delete()}}
    setSync('ok')}
  catch(e){setSync('err')}finally{writing[key]=false}
}
function setSync(s){SYNC=s;const el=$('#sync');if(el){el.className='sync '+s;el.lastChild.textContent=syncText()}}
const syncText=()=>({wait:'連線中…',ok:'已同步到雲端，手機與電腦看到同一份資料',local:'資料只存在這台裝置的瀏覽器，換裝置前請先匯出',err:'雲端同步失敗，資料已先存在這台裝置'}[SYNC]);
async function initRemote(){
  try{
    if(!window.claude||!claude.use){setSync('local');return}
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    const id=user?await user.id():null;
    if(!db||!id){setSync('local');return}
    const root=db.doc('data/users/'+id+'/ledger');monthsCol=root.collection('months');metaRef=root;
    let first=true;
    root.onSnapshot(snap=>{
      if(dirty.has('meta')||writing.meta)return;
      if(snap.exists){const d=snap.data();if(d&&d.accounts){S.meta=clone(d);saveLocal();render()}}
      else if(!snap.metadata.fromCache)touch('meta');
    },()=>setSync('err'));
    monthsCol.limit(1000).onSnapshot(snap=>{
      const seen=new Set();
      snap.docs.forEach(d=>{seen.add(d.id);if(dirty.has(d.id)||writing[d.id])return;const v=d.data();if(v&&v.recs)S.months[d.id]=clone(v)});
      if(!snap.metadata.fromCache){
        if(first){first=false;Object.keys(S.months).forEach(m=>{if(!seen.has(m)&&Object.keys(S.months[m].recs||{}).length)touch(m)})}
        else snap.docChanges().forEach(c=>{if(c.type==='removed'&&!dirty.has(c.doc.id)&&!writing[c.doc.id])delete S.months[c.doc.id]});
        if(SYNC!=='err')setSync('ok');
      }
      saveLocal();render();
    },()=>setSync('err'));
  }catch(e){setSync('local')}
}

/* ---------- 資料工具 ---------- */
const accById=id=>S.meta.accounts.find(a=>a.id===id);
const allRecs=()=>Object.values(S.months).flatMap(m=>Object.values(m.recs||{}));
const monthRecs=(m,acc)=>Object.values((S.months[m]||{}).recs||{}).filter(r=>!acc||acc==='all'||r.acc===acc);
const sum=(rs,t)=>rs.filter(r=>r.t===t).reduce((s,r)=>s+(+r.amt||0),0);
function fmt(n,cur){const c=CUR[cur]||[cur+' ',2];return(n<0?'−':'')+c[0]+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:c[1],maximumFractionDigits:c[1]})}
function putRec(r){const m=r.date.slice(0,7);(S.months[m]=S.months[m]||{recs:{}}).recs[r.id]=r;return m}
function delRec(r){const m=r.date.slice(0,7);if(S.months[m]){delete S.months[m].recs[r.id];if(!Object.keys(S.months[m].recs).length)delete S.months[m]}return m}
const findRec=id=>allRecs().find(r=>r.id===id);
function catColor(t,cat){const i=S.meta.cats[t].indexOf(cat);return COLORS[(i<0?9:i)%COLORS.length]}
function toast(msg,ms=3200){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,ms)}

/* ---------- 生命之花地球 ---------- */
function flower(withAcc){
  const r=30,pts=[[0,0]],rad=d=>d*Math.PI/180;
  for(let k=0;k<6;k++){const a=rad(k*60),b=rad(k*60+30);pts.push([r*Math.cos(a),r*Math.sin(a)],[2*r*Math.cos(a),2*r*Math.sin(a)],[Math.sqrt(3)*r*Math.cos(b),Math.sqrt(3)*r*Math.sin(b)])}
  const cs=pts.map(p=>`<circle cx="${p[0].toFixed(2)}" cy="${p[1].toFixed(2)}" r="${r}" fill="var(--gold)" fill-opacity=".13" stroke="var(--gold)" stroke-width="1.4"/>`).join('');
  let dots='';
  if(withAcc){S.meta.accounts.slice(0,12).forEach((a,i)=>{const ring=i<6?r:Math.sqrt(3)*r,ang=rad(-90+(i%6)*60+(i<6?0:30));const x=ring*Math.cos(ang),y=ring*Math.sin(ang);
    dots+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="9" fill="var(--neon)" stroke="var(--ink)" stroke-width="1.5"/><text x="${x.toFixed(1)}" y="${(y+2.8).toFixed(1)}" text-anchor="middle" font-size="7.5" font-weight="800" fill="#241803" font-family="Outfit,sans-serif">${esc(a.country==='XX'?a.cur.slice(0,2):a.country)}</text>`})}
  return`<svg class="flower" viewBox="-100 -100 200 200" role="img" aria-label="以生命之花構成的地球村"><defs><clipPath id="clip${withAcc?1:0}"><circle r="90"/></clipPath></defs>
  <circle r="90" fill="var(--surface)"/>
  <g clip-path="url(#clip${withAcc?1:0})"><g class="spin">${cs}</g>
  <g fill="none" stroke="var(--red)" stroke-width="1" opacity=".75"><ellipse rx="30" ry="90"/><ellipse rx="62" ry="90"/><line x1="-90" x2="90" y1="0" y2="0"/><path d="M-78 -45 H78 M-78 45 H78"/></g></g>
  <circle r="90" fill="none" stroke="var(--ink)" stroke-width="2.5"/><circle r="96" fill="none" stroke="var(--ochre)" stroke-width="1.2"/>${dots}</svg>`;
}

/* ---------- 畫面 ---------- */

/* ---------- 影像：QR 與拍照辨識 ---------- */
let scanMode='',ocrCtl=null;
function fileToCanvas(file,max){return new Promise((res,rej)=>{const url=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const k=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c)};
  im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'))};im.src=url})}
function decodeBytes(b){if(!b||!b.length)return'';const u=Uint8Array.from(b);try{return new TextDecoder('utf-8',{fatal:true}).decode(u)}catch(e){try{return new TextDecoder('big5').decode(u)}catch(e2){return''}}}
const isLeft=t=>/^[A-Z]{2}\d{8}\d{7}\d{4}[0-9a-fA-F]{16}/.test(t);
async function scanQRs(src){
  const out=[];if(typeof jsQR!=='function')return out;
  const W=src.width,H=src.height,c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});
  const regs=[[0,0,1,1],[0,0,.6,1],[.4,0,.6,1],[0,0,1,.6],[0,.4,1,.6],[0,0,.6,.6],[.4,0,.6,.6],[0,.4,.6,.6],[.4,.4,.6,.6]];
  for(const [rx,ry,rw,rh] of regs){
    const sw=W*rw,sh=H*rh,k=Math.min(1,1400/Math.max(sw,sh));c.width=Math.round(sw*k);c.height=Math.round(sh*k);
    x.drawImage(src,W*rx,H*ry,sw,sh,0,0,c.width,c.height);
    for(let n=0;n<3;n++){
      const im=x.getImageData(0,0,c.width,c.height),r=jsQR(im.data,im.width,im.height);if(!r)break;
      const t=decodeBytes(r.binaryData)||r.data;if(t&&!out.includes(t))out.push(t);
      const l=r.location;x.fillStyle=x.strokeStyle='#fff';x.lineWidth=24;x.beginPath();x.moveTo(l.topLeftCorner.x,l.topLeftCorner.y);x.lineTo(l.topRightCorner.x,l.topRightCorner.y);x.lineTo(l.bottomRightCorner.x,l.bottomRightCorner.y);x.lineTo(l.bottomLeftCorner.x,l.bottomLeftCorner.y);x.closePath();x.fill();x.stroke();
    }
    if(out.some(isLeft)&&out.some(t=>t.startsWith('**')))break;
    await new Promise(r=>setTimeout(r));
  }
  return out;
}
function parseTWQR(codes){
  const L=codes.find(isLeft);if(!L)return null;const R=codes.find(t=>t.startsWith('**'))||'';
  const date=`${+L.slice(10,13)+1911}-${L.slice(13,15)}-${L.slice(15,17)}`,sales=parseInt(L.slice(21,29),16)||0,total=parseInt(L.slice(29,37),16)||0;
  const p=L.slice(77).split(':'),enc=p[4];let s=p.slice(5).join(':')+(R?R.slice(2):'');
  if(enc==='2'){try{s=decodeBytes([...atob(s.replace(/\s/g,''))].map(ch=>ch.charCodeAt(0)))||s}catch(e){}}
  const f=s.replace(/^:+/,'').split(':'),items=[];
  for(let i=0;i+2<f.length;i+=3){const q=parseFloat(f[i+1]),pr=parseFloat(f[i+2]);if(f[i].trim()&&isFinite(q)&&isFinite(pr))items.push({n:f[i].trim(),q,p:pr})}
  const isum=items.reduce((t,i)=>t+i.q*i.p,0);
  return{inv:L.slice(0,10),date,rnd:L.slice(17,21),amt:total||sales||Math.round(isum),items,seller:L.slice(45,53),full:!!R};
}
function applyQR(q){
  F.inv=q.inv;F.rnd=q.rnd;F.date=q.date;if(q.amt)F.amt=q.amt;
  if(q.items.length){F.items=q.items;if(!F.title)F.title=q.items[0].n+(q.items.length>1?` 等 ${q.items.length} 項`:'')}
  if(q.seller&&q.seller!=='00000000'&&!F.note.includes(q.seller))F.note=(F.note?F.note+'\n':'')+'賣方統編 '+q.seller;
}
function setMsg(msg,busy){if(!F)return;collectForm();F.msg=msg;F.busy=!!busy;renderForm()}
async function handleImage(file){
  if(!F)return;const a=accById(F.acc),tw=a.country==='TW';
  setMsg(scanMode==='qr'?'正在解析 QR Code…':'正在辨識發票內容，通常需要 10–60 秒…',scanMode==='ocr');
  let canvas=null,qr=null;
  try{canvas=await fileToCanvas(file,2400)}catch(e){}
  if(tw&&canvas){try{qr=parseTWQR(await scanQRs(canvas))}catch(e){}}
  if(!F)return;
  if(scanMode==='qr'){
    if(!qr)return setMsg('找不到電子發票 QR Code。請靠近一點、對好焦再拍一次，或改用「拍照辨識紙本發票」。');
    collectForm();applyQR(qr);F.msg=qr.full?'已帶入發票資料。QR Code 不含店名，請自行補上。':'只讀到左邊的 QR Code，明細可能不完整；店名請自行補上。';F.busy=false;return renderForm();
  }
  let sample=null;try{sample=window.claude&&claude.use?await claude.use('sample'):null}catch(e){}
  if(!sample){if(qr){collectForm();applyQR(qr)}return setMsg('這個環境無法使用拍照辨識'+(qr?'，已先帶入 QR Code 的資料。':'，請手動輸入。'))}
  let img=file;if(canvas){const c2=canvas.width>2000||canvas.height>2000?await fileToCanvas(file,2000):canvas;img=await new Promise(r=>c2.toBlob(b=>r(b||file),'image/jpeg',.9))}
  const prompt=`這是一張${a.name}的發票或收據照片（幣別預期為 ${a.cur}）。請讀出內容，只回覆一個 JSON 物件，不要其他文字：
{"store":"店家名稱","date":"YYYY-MM-DD","time":"HH:MM","total":數字,"currency":"ISO 幣別代碼","invoiceNo":"發票或收據號碼","randomCode":"台灣發票的 4 位隨機碼","title":"用 12 字以內概括買了什麼","category":"從下列擇一","items":[{"name":"品名","qty":數量,"price":單價}]}
規則：看不到或不確定的欄位填 null，不要猜。date 一律轉成西元（民國年加 1911；令和年加 2018）。total 是實付總額（含稅）。price 是單價不是小計。品名保留原文。台灣發票號碼格式為 2 個英文字母加 8 位數字，不要連字號。
category 只能是：${S.meta.cats[F.t].join('、')}`;
  ocrCtl=new AbortController();
  try{
    const d=await sample.json(prompt,{images:img,signal:ocrCtl.signal});
    if(!F)return;collectForm();
    if(d&&typeof d==='object'){
      if(d.store)F.store=String(d.store);if(/^\d{4}-\d{2}-\d{2}$/.test(d.date||''))F.date=d.date;if(/^\d{1,2}:\d{2}/.test(d.time||''))F.time=d.time.slice(0,5).padStart(5,'0');
      if(+d.total>0)F.amt=+d.total;if(d.invoiceNo)F.inv=String(d.invoiceNo).replace(/[-\s]/g,'').toUpperCase();if(d.randomCode&&tw)F.rnd=String(d.randomCode);
      if(d.title)F.title=String(d.title);if(S.meta.cats[F.t].includes(d.category))F.cat=d.category;
      if(Array.isArray(d.items)&&d.items.length)F.items=d.items.filter(i=>i&&i.name).map(i=>({n:String(i.name),q:+i.qty||1,p:+i.price||0}));
      const title=F.title;if(qr){F.title=title||'';applyQR(qr)}
      F.msg='已帶入辨識結果，請核對後再儲存。'+(d.currency&&d.currency!==a.cur?`（單據幣別看起來是 ${d.currency}，與帳戶的 ${a.cur} 不同）`:'');
    }else F.msg='辨識不到內容，請重拍或手動輸入。';
  }catch(e){
    if(!F)return;collectForm();if(qr)applyQR(qr);
    const m={cancelled:'已停止辨識。',not_granted:'尚未允許此頁面使用 Claude，無法辨識。',rate_limited:'用量已達上限，請稍後再試。',image_rejected:'這張圖片無法處理，請換一張。',images_unavailable:'這個環境無法傳送圖片辨識。',session_expired:'請重新登入後再試。',refused:'這張圖片無法辨識，請換一張。',invalid_json:'辨識結果格式有誤，請再試一次。'};
    F.msg=(m[e&&e.code]||'辨識失敗，請再試一次。')+(qr?' 已先帶入 QR Code 的資料。':'');
  }
  ocrCtl=null;F.busy=false;renderForm();
}

/* ---------- 匯出／匯入 ---------- */
async function saveFile(filename,data){
  let dl=null;try{dl=window.claude&&claude.use?await claude.use('downloads'):null}catch(e){}
  if(dl){try{await dl.save({filename,data});return toast('已儲存 '+filename)}catch(e){if(e&&e.code==='declined')return;if(e&&e.code==='rate_limited')return toast('請稍候再試一次')}}
  sheet(`${head('匯出內容')}<p class="note">這個環境無法直接存檔。請複製下面的內容，貼到記事本存成 ${esc(filename)}。</p><div class="row-b"><button class="btn pri" data-act="copyOut">複製全部</button></div><pre class="out" id="out"></pre>`);$('#out').textContent=data;
}
const csvCell=v=>{v=String(v??'');return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const CSV_H=['類型','帳戶','幣別','金額','品項','分類','店家','日期','時間','發票號碼','隨機碼','明細','備註','編號'];
function exportCSV(){
  const rows=allRecs().sort(byNew).map(r=>{const a=accById(r.acc)||{name:'',cur:''};return[r.t==='exp'?'支出':'收入',a.name,a.cur,r.amt,r.title,r.cat,r.store,r.date,r.time,r.inv,r.rnd,(r.items||[]).map(i=>`${i.n}×${i.q}@${i.p}`).join('；'),r.note,r.id]});
  saveFile(`地球村帳本-${today()}.csv`,'﻿'+[CSV_H,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n'));
}
function exportJSON(){saveFile(`地球村帳本-${today()}.json`,JSON.stringify({app:'地球村帳本',v:1,exported:new Date().toISOString(),meta:S.meta,records:allRecs()},null,1))}
function parseCSV(t){const rows=[];let row=[],cur='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}else if(c==='"')q=true;else if(c===','){row.push(cur);cur=''}else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur=''}else if(c!=='\r')cur+=c}if(cur||row.length){row.push(cur);rows.push(row)}return rows}
async function readText(file){const b=new Uint8Array(await file.arrayBuffer());let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(e){t=new TextDecoder('big5').decode(b)}return t.replace(/^﻿/,'')}
function normDate(s){s=String(s||'').trim();const g=s.replace(/\D/g,'');let y,m,d;
  if(/^\d{8}$/.test(g)&&!/[\/\-.]/.test(s)){y=g.slice(0,4);m=g.slice(4,6);d=g.slice(6)}else if(/^\d{7}$/.test(g)&&!/[\/\-.]/.test(s)){y=+g.slice(0,3)+1911;m=g.slice(3,5);d=g.slice(5)}
  else{const p=s.split(/[^\d]+/).filter(Boolean);if(p.length<3)return'';y=+p[0]<1000?+p[0]+1911:+p[0];m=pad(+p[1]);d=pad(+p[2])}
  return`${y}-${m}-${d}`}
function parseCloud(text){
  const inv={},get=k=>inv[k]=inv[k]||{inv:k,date:'',store:'',amt:0,items:[],void:false};
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  if(lines.some(l=>/^M\|/.test(l))){
    lines.forEach(l=>{const p=l.split('|');
      if(p[0]==='M'&&p[6]){const o=get(p[6].trim());o.date=normDate(p[3]);o.store=(p[5]||'').trim();o.amt=+p[7]||0;o.void=/作廢|註銷/.test(p[8]||'')}
      else if(p[0]==='D'&&p[1]){get(p[1].trim()).items.push({n:(p[3]||'').trim(),q:1,p:+p[2]||0})}});
  }else{
    const rows=parseCSV(text),hi=rows.findIndex(r=>r.some(c=>c.includes('發票號碼')));if(hi<0)return[];
    const h=rows[hi].map(c=>c.trim()),col=re=>h.findIndex(c=>re.test(c));
    const cN=col(/發票號碼/),cD=col(/日期/),cS=col(/店名|賣方名稱|商店|賣方/),cA=col(/總金額|總計|發票金額|金額/),cSt=col(/狀態/),cI=col(/品名|品項/),cP=col(/小計|單價/);
    rows.slice(hi+1).forEach(r=>{const k=(r[cN]||'').replace(/[-\s]/g,'');if(!/^[A-Z]{2}\d{8}$/i.test(k))return;const o=get(k.toUpperCase());
      if(cD>=0&&r[cD])o.date=normDate(r[cD]);if(cS>=0&&r[cS])o.store=r[cS].trim();if(cA>=0&&+String(r[cA]).replace(/,/g,''))o.amt=+String(r[cA]).replace(/,/g,'');
      if(cSt>=0&&/作廢|註銷/.test(r[cSt]||''))o.void=true;if(cI>=0&&r[cI])o.items.push({n:r[cI].trim(),q:1,p:cP>=0?+String(r[cP]).replace(/,/g,'')||0:0})});
  }
  return Object.values(inv).filter(o=>!o.void&&/^\d{4}-\d{2}-\d{2}$/.test(o.date)).map(o=>{if(!o.amt)o.amt=o.items.reduce((s,i)=>s+i.p*i.q,0);return o}).filter(o=>o.amt>0).sort((a,b)=>b.date.localeCompare(a.date));
}
function openCloud(list){
  const tws=S.meta.accounts.filter(a=>a.country==='TW');
  if(!tws.length){sheet(`${head('台灣雲端發票')}<p>請先新增一個台灣帳戶。</p>`);return}
  if(!list){CI=null;sheet(`${head('台灣雲端發票')}<p class="note">網頁無法直接登入財政部替你下載發票。請先取得載具消費明細檔：</p>
    <p class="note">1. 每月寄到信箱的「消費發票彙整通知」附件 CSV；或<br>2. 登入財政部電子發票整合服務平台，在載具發票查詢頁下載 CSV。</p>
    <div class="row-b"><button class="btn hot" data-act="pickCloud">選擇發票 CSV 檔</button></div>`);return}
  const have=new Set(allRecs().map(r=>r.inv).filter(Boolean));
  CI={list:list.map(o=>({...o,dup:have.has(o.inv)}))};
  const rows=CI.list.map((o,i)=>`<label class="ci"><input type="checkbox" class="ci-on" data-i="${i}" ${o.dup?'':'checked'}><span><b>${esc(o.store||'（無店名）')}</b><br><small class="note">${esc(o.date)} · ${esc(o.inv)}${o.items.length?` · ${o.items.length} 項`:''}${o.dup?' · 已記過':''}</small></span><span class="num exp">${esc(fmt(o.amt,'TWD'))}</span></label>`).join('');
  sheet(`${head('選擇要新增的發票')}<div class="field"><label for="ci-acc">記到哪個帳戶</label><select id="ci-acc">${tws.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select></div>
    <div class="field"><label for="ci-cat">分類（之後可逐筆修改）</label><select id="ci-cat">${S.meta.cats.exp.map(c=>`<option ${c==='其他'?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
    <div>${rows}</div><div class="row-b"><button class="btn pri" data-act="addCloud">新增勾選的發票</button></div>`);
}
async function handleData(file){
  let text;try{text=await readText(file)}catch(e){return toast('讀不到這個檔案')}
  if(/^\s*[{[]/.test(text)){
    let d;try{d=JSON.parse(text)}catch(e){return toast('JSON 格式有誤，無法匯入')}
    const recs=Array.isArray(d)?d:d.records;if(!Array.isArray(recs))return toast('檔案裡沒有紀錄');
    if(d.meta&&Array.isArray(d.meta.accounts))d.meta.accounts.forEach(a=>{if(a&&a.id&&!accById(a.id))S.meta.accounts.push(a)});
    const ms=new Set();let n=0;recs.forEach(r=>{if(!r||!r.id||!/^\d{4}-\d{2}-\d{2}$/.test(r.date||'')||!accById(r.acc))return;const o=findRec(r.id);if(o)ms.add(delRec(o));ms.add(putRec(r));n++});
    touch('meta');ms.forEach(touch);closeSheet();render();return toast(`已匯入 ${n} 筆紀錄`);
  }
  const first=text.split(/\r?\n/)[0]||'';
  if(first.includes('類型')&&first.includes('帳戶')){
    const rows=parseCSV(text),h=rows[0].map(c=>c.trim()),ix=k=>h.indexOf(k),ms=new Set();let n=0,metaCh=false;
    rows.slice(1).forEach(r=>{const g=k=>(r[ix(k)]||'').trim(),date=normDate(g('日期')),amt=+g('金額');if(!date||!(amt>0))return;
      let a=S.meta.accounts.find(x=>x.name===g('帳戶'));
      if(!a){const cur=CUR[g('幣別')]?g('幣別'):S.meta.base,c=COUNTRIES.find(x=>x[2]===cur)||COUNTRIES[COUNTRIES.length-1];a={id:uid(),name:g('帳戶')||c[1],country:c[0],cur,rate:roughRate(cur,S.meta.base)};S.meta.accounts.push(a);metaCh=true}
      const items=g('明細')?g('明細').split('；').map(s=>{const m=s.match(/^(.*)×([\d.]+)@([\d.]+)$/);return m?{n:m[1],q:+m[2],p:+m[3]}:{n:s,q:1,p:0}}):[];
      const rec={id:g('編號')||uid(),t:g('類型')==='收入'?'inc':'exp',acc:a.id,amt,title:g('品項'),cat:g('分類')||'其他',store:g('店家'),date,time:g('時間'),inv:g('發票號碼'),rnd:g('隨機碼'),items,note:g('備註'),ts:Date.now()};
      const o=findRec(rec.id);if(o)ms.add(delRec(o));ms.add(putRec(rec));n++});
    if(metaCh)touch('meta');ms.forEach(touch);closeSheet();render();return toast(`已匯入 ${n} 筆紀錄`);
  }
  const list=parseCloud(text);if(!list.length)return toast('看不懂這個檔案的格式。可匯入本 App 匯出的 JSON／CSV，或財政部的載具發票 CSV。',5000);
  openCloud(list);
}

/* ---------- 事件 ---------- */
function shiftMonth(n){const [y,m]=M.split('-').map(Number),d=new Date(y,m-1+n,1);M=`${d.getFullYear()}-${pad(d.getMonth()+1)}`;render()}
const armed=b=>{if(b.dataset.armed)return true;b.dataset.armed=1;b.dataset.label=b.textContent;b.textContent='再按一次確定刪除';b.classList.add('hot');setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent=b.dataset.label;b.classList.remove('hot')}},3500);return false};
document.addEventListener('click',e=>{
  if(e.target.id==='sheet')return closeSheet();
  const b=e.target.closest('[data-act]');if(!b)return;const d=b.dataset;
  switch(d.act){
    case'pm':return shiftMonth(-1);case'nm':return shiftMonth(1);
    case'tab':TAB=d.tab;render();return window.scrollTo(0,0);
    case'acc':ACC=d.id;return render();
    case'openAcc':ACC=d.id;TAB='list';render();return window.scrollTo(0,0);
    case'stype':STYPE=d.t;return render();
    case'add':return openForm();
    case'edit':{const r=findRec(d.id);return r&&openForm(r)}
    case'close':return closeSheet();
    case'ftype':collectForm();F.t=d.t;F.cat='';return renderForm();
    case'addItem':collectForm();F.items.push({n:'',q:1,p:''});return renderForm();
    case'rmItem':collectForm();F.items.splice(+d.i,1);return renderForm();
    case'sumItems':{collectForm();const s=F.items.reduce((t,i)=>t+(+i.q||0)*(+i.p||0),0);if(s>0)F.amt=+s.toFixed(2);else toast('明細還沒有數量與單價');return renderForm()}
    case'save':return saveForm();
    case'del':{if(!armed(b))return;const r=findRec(F.id);if(r)touch(delRec(r));closeSheet();render();return toast('已刪除')}
    case'scan':collectForm();scanMode=d.m;$('#fImg').value='';return $('#fImg').click();
    case'stopOcr':return ocrCtl&&ocrCtl.abort();
    case'newAcc':return openAcc();
    case'editAcc':return openAcc(accById(d.id));
    case'saveAcc':{const id=$('#a-id').value,name=$('#a-name').value.trim(),country=$('#a-country').value,cur=$('#a-cur').value,rate=+$('#a-rate').value;
      if(!name)return toast('請輸入帳戶名稱');if(!(rate>0))return toast('請輸入大於 0 的匯率');
      const a=accById(id);if(a)Object.assign(a,{name,country,cur,rate});else S.meta.accounts.push({id:uid(),name,country,cur,rate});
      touch('meta');closeSheet();render();return toast('已儲存帳戶')}
    case'delAcc':{if(+d.n>0)return toast(`這個帳戶還有 ${d.n} 筆紀錄，請先刪除那些紀錄`);if(S.meta.accounts.length<2)return toast('至少要保留一個帳戶');if(!armed(b))return;
      S.meta.accounts=S.meta.accounts.filter(a=>a.id!==$('#a-id').value);touch('meta');closeSheet();return render()}
    case'saveCats':{const sp=v=>[...new Set(v.split(/[,，、\n]/).map(s=>s.trim()).filter(Boolean))],x=sp($('#cexp').value),i=sp($('#cinc').value);
      if(!x.length||!i.length)return toast('每種至少要有一個分類');S.meta.cats={exp:x,inc:i};touch('meta');b.blur();render();return toast('已儲存分類')}
    case'expJSON':return exportJSON();case'expCSV':return exportCSV();
    case'impData':case'pickCloud':$('#fData').value='';return $('#fData').click();
    case'cloud':return openCloud();
    case'addCloud':{const acc=$('#ci-acc').value,cat=$('#ci-cat').value,ms=new Set();let n=0;
      $$('.ci-on').forEach(c=>{if(!c.checked)return;const o=CI.list[+c.dataset.i];
        ms.add(putRec({id:uid(),t:'exp',acc,amt:o.amt,title:o.items.length?o.items[0].n+(o.items.length>1?` 等 ${o.items.length} 項`:''):o.store,cat,store:o.store,date:o.date,time:'',inv:o.inv,rnd:'',items:o.items,note:'雲端發票匯入',ts:Date.now()}));n++});
      if(!n)return toast('沒有勾選任何發票');ms.forEach(touch);closeSheet();TAB='list';ACC=acc;render();return toast(`已新增 ${n} 筆發票`)}
    case'copyOut':{const t=$('#out').textContent;return navigator.clipboard.writeText(t).then(()=>toast('已複製')).catch(()=>{const r=document.createRange();r.selectNodeContents($('#out'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('已全選，請手動複製')})}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet();if((e.key==='Enter'||e.key===' ')&&e.target.matches('.acc[role=button]')){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){Q=e.target.value;$('#listBody').innerHTML=listBody()}});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='fImg'&&t.files[0])return handleImage(t.files[0]);
  if(t.id==='fData'&&t.files[0])return handleData(t.files[0]);
  if(t.id==='f-acc'){collectForm();return renderForm()}
  if(t.id==='a-country'){const c=COUNTRIES.find(x=>x[0]===t.value);if(c[0]!=='XX'){$('#a-cur').value=c[2];$('#a-rate').value=roughRate(c[2],S.meta.base);if(!$('#a-name').value)$('#a-name').value=c[1]}return}
  if(t.id==='a-cur'){$('#a-rate').value=roughRate(t.value,S.meta.base);return}
  if(t.id==='base'){S.meta.base=t.value;S.meta.accounts.forEach(a=>a.rate=roughRate(a.cur,t.value));touch('meta');render();toast('已更換合計幣別，各帳戶匯率已重設為概略值')}
});
$('#logo').innerHTML=flower(false).replace('class="flower"','');
render();initRemote();
